<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Dominion — Sector Warfare</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080a; color: #c9f4ee;
    font: 13px ui-monospace, Menlo, Consolas, monospace; user-select: none; -webkit-user-select: none; }
  #gl { image-rendering: pixelated; image-rendering: crisp-edges; }
  #gl, #map { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #map { pointer-events: none; }
  body.mapmode #map { pointer-events: auto; cursor: crosshair; }
  .hud { position: fixed; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #tl { top: 12px; left: 14px; line-height: 1.55; }
  #tr { top: 12px; right: 14px; text-align: right; line-height: 1.55; }
  #log { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; color: #fff; }
  #log div { transition: opacity .6s; }
  #help { bottom: 62px; left: 50%; transform: translateX(-50%); opacity: .75; white-space: nowrap; font-size: 11px; }
  #bar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  #bar button { font: inherit; color: #c9f4ee; background: rgba(8,30,34,.8); border: 1px solid #2c8f99; border-radius: 6px;
    padding: 7px 12px; cursor: pointer; }
  #bar button:hover { background: rgba(31,182,201,.3); }
  #bar button.no { opacity: .4; }
  #bar b { color: #ffd76a; font-weight: 600; }
  #cross { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none;
    background: linear-gradient(#c9f4ee,#c9f4ee) 50% 0/2px 7px no-repeat, linear-gradient(#c9f4ee,#c9f4ee) 50% 100%/2px 7px no-repeat,
      linear-gradient(#c9f4ee,#c9f4ee) 0 50%/7px 2px no-repeat, linear-gradient(#c9f4ee,#c9f4ee) 100% 50%/7px 2px no-repeat; }
  body.mapmode #cross { display: none; }
  .meter { display: inline-block; width: 130px; height: 8px; border: 1px solid #2c8f99; vertical-align: middle; background: rgba(0,0,0,.4); }
  .meter i { display: block; height: 100%; background: #46e0a0; }
  #ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(3,8,10,.82); z-index: 5; }
  #ov .box { max-width: 640px; padding: 26px 34px; border: 1px solid #2c8f99; background: rgba(6,22,26,.9); line-height: 1.6; }
  #ov h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 4px; color: #6ff0ff; }
  #ov h2 { margin: 0 0 14px; font-size: 13px; color: #ffd76a; font-weight: 600; letter-spacing: 2px; }
  #ov kbd { color: #ffd76a; }
  #ov .go { margin-top: 14px; color: #ffd76a; }
  #dmg { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(transparent 55%, rgba(255,40,30,.55)); opacity: 0; }
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="map"></canvas>
<div id="dmg"></div><div id="cross"></div>
<div id="tl" class="hud"></div><div id="tr" class="hud"></div><div id="log" class="hud"></div>
<div id="help" class="hud"></div>
<div id="bar"></div>
<div id="ov"><div class="box" id="ovbox"></div></div>
<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- definitions ----------
const SS = 140;                                   // sector size
const COL = [0x70786c, 0x1fb6c9, 0xe0512f];       // neutral, player, enemy
const CSS = ['#8a9286', '#27c6da', '#f0603c'];
const FNAME = ['Neutral', 'Meridian', 'Ashfall'];
const DEF = {
  scout:   { name: 'Scout',    cost: 40,  hp: 60,   speed: 62, range: 115, dmg: 6,  rof: 0.32, r: 5,  key: '1' },
  tank:    { name: 'Tank',     cost: 90,  hp: 190,  speed: 34, range: 150, dmg: 22, rof: 1.1,  r: 7,  key: '2' },
  gunship: { name: 'Gunship',  cost: 140, hp: 110,  speed: 72, range: 150, dmg: 10, rof: 0.3,  r: 6,  key: '3', air: true },
  turret:  { name: 'Turret',   cost: 70,  hp: 240,  speed: 0,  range: 195, dmg: 14, rof: 0.6,  r: 6,  key: '4' },
  hq:      { name: 'Host Station', cost: 0, hp: 6000, speed: 0, range: 235, dmg: 30, rof: 0.4, r: 28, air: true }
};
const BUILDABLE = ['scout', 'tank', 'gunship', 'turret'];
const UNIT_CAP = 30, JUMP_COST = 120;

// ---------- three setup ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: false });
const scene = new THREE.Scene();
const FOGC = 0x3a424c;
scene.background = new THREE.Color(FOGC);
scene.fog = new THREE.Fog(FOGC, 140, 1150);
const camera = new THREE.PerspectiveCamera(68, 1, 1, 3000);
const mapCv = $('map'), m2 = mapCv.getContext('2d');
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const k = Math.min(1, 360 / innerHeight);   // chunky low-resolution 3D, scaled up without smoothing
  renderer.setPixelRatio(1); renderer.setSize(Math.round(innerWidth * k), Math.round(innerHeight * k), false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  mapCv.width = innerWidth * dpr; mapCv.height = innerHeight * dpr;
}
addEventListener('resize', resize); resize();
const GEO = { box: new THREE.BoxGeometry(1, 1, 1), sph: new THREE.SphereGeometry(1, 12, 8), cyl: new THREE.CylinderGeometry(1, 1, 1, 12), tile: new THREE.PlaneGeometry(SS - 3, SS - 3) };
GEO.tile.rotateX(-Math.PI / 2);
function tex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; return t;
}
const TEX = {
  ground: tex(64, 64, (c, w, h) => {
    c.fillStyle = '#b4b4b4'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { const v = 120 + Math.random() * 120 | 0; c.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; c.fillRect(Math.random() * w | 0, Math.random() * h | 0, 1 + Math.random() * 2 | 0, 1); }
    c.fillStyle = '#5a5a5a'; c.fillRect(0, 0, w, 2); c.fillRect(0, 0, 2, h); c.fillRect(0, h - 2, w, 2); c.fillRect(w - 2, 0, 2, h);
    c.fillStyle = '#8a8a8a'; c.fillRect(31, 2, 1, h - 4); c.fillRect(2, 31, w - 4, 1);
  }),
  wall: tex(32, 32, (c, w, h) => {
    c.fillStyle = '#a8a8a8'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) { const v = 130 + Math.random() * 70 | 0; c.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; c.fillRect(Math.random() * w | 0, Math.random() * h | 0, 2, 1); }
    for (let y = 3; y < h - 3; y += 6) for (let x = 3; x < w - 3; x += 5) { c.fillStyle = Math.random() < 0.3 ? '#ffe9a8' : '#3c4046'; c.fillRect(x, y, 3, 3); }
    c.fillStyle = '#6a6a6a'; c.fillRect(0, 0, w, 1); c.fillRect(0, h - 1, w, 1);
  })
};
const lam = (c, map) => new THREE.MeshLambertMaterial({ color: c, map: map || null });
const MAT = {
  hull: [null, lam(0x3f7f8c), lam(0x8c4a3a)], trim: [null, lam(0x1fb6c9), lam(0xe0512f)], dark: lam(0x23282a),
  bld: [lam(0xa0a69c, TEX.wall), lam(0x86c0c8, TEX.wall), lam(0xd0937f, TEX.wall)], glow: COL.map(c => new THREE.MeshBasicMaterial({ color: c })),
  shot: [null, new THREE.MeshBasicMaterial({ color: 0x8ff6ff }), new THREE.MeshBasicMaterial({ color: 0xffb070 })],
  rotor: new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.35 })
};
function box(mat, w, h, d, x, y, z, parent) { const m = new THREE.Mesh(GEO.box, mat); m.scale.set(w, h, d); m.position.set(x, y, z); parent.add(m); return m; }
function cyl(mat, r, h, x, y, z, parent) { const m = new THREE.Mesh(GEO.cyl, mat); m.scale.set(r, h, r); m.position.set(x, y, z); parent.add(m); return m; }

function unitMesh(type, f) {
  const g = new THREE.Group(), H = MAT.hull[f], T = MAT.trim[f], D = MAT.dark;
  if (type === 'scout') {
    box(H, 5, 2, 8.5, 0, 2, 0, g); box(T, 4, 1.4, 3.5, 0, 3.5, -1, g); box(D, 0.7, 0.7, 5, 0, 3.6, 3, g);
    for (const [x, z] of [[-3, 3], [3, 3], [-3, -3], [3, -3]]) box(D, 1.4, 2.2, 2.6, x, 1.1, z, g);
  } else if (type === 'tank') {
    box(D, 9, 2, 12, 0, 1, 0, g); box(H, 8, 2.2, 11, 0, 2.8, 0, g); box(T, 5, 2, 5.5, 0, 4.8, -0.5, g); box(D, 0.9, 0.9, 8, 0, 4.9, 5.5, g);
  } else if (type === 'gunship') {
    box(H, 4.5, 3, 9, 0, 0, 0, g); box(T, 3.2, 1.8, 3, 0, 0.8, 4, g); box(H, 1.2, 1.2, 7, 0, 0.6, -7, g); box(T, 0.6, 3, 1.6, 0, 1.8, -10, g);
    box(D, 10, 0.5, 2, 0, -0.6, 0.5, g);
    const r = cyl(MAT.rotor, 8, 0.2, 0, 2.4, 0, g); g.userData.rotor = r;
  } else if (type === 'turret') {
    cyl(D, 5, 3, 0, 1.5, 0, g); cyl(H, 3.6, 3, 0, 4.5, 0, g); box(T, 1, 1, 8, -1, 5, 4, g); box(T, 1, 1, 8, 1, 5, 4, g);
  } else {
    cyl(H, 28, 7, 0, 0, 0, g); cyl(D, 20, 4, 0, -5, 0, g); cyl(T, 30, 1.2, 0, 1, 0, g);
    const dome = new THREE.Mesh(GEO.sph, MAT.trim[f]); dome.scale.set(11, 8, 11); dome.position.y = 4; g.add(dome);
    cyl(MAT.glow[f], 5, 3, 0, -8, 0, g);
    for (let i = 0; i < 4; i++) box(D, 3, 2, 9, Math.sin(i * TAU / 4) * 26, 3, Math.cos(i * TAU / 4) * 26, g).rotation.y = i * TAU / 4;
  }
  return g;
}

// ---------- audio ----------
let ac = null, master = null, noiseBuf = null, muted = false, sndN = 0;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // brooding drone: detuned low saws through a slowly breathing filter
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 170; f.Q.value = 4;
    const g = ac.createGain(); g.gain.value = 0.09; f.connect(g); g.connect(master);
    for (const hz of [41.2, 41.5, 61.9, 82.1]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz; o.connect(f); o.start(); }
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 70; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    // wind
    const w = ac.createBufferSource(); w.buffer = noiseBuf; w.loop = true;
    const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 380; wf.Q.value = 0.7;
    const wg = ac.createGain(); wg.gain.value = 0.035; w.connect(wf); wf.connect(wg); wg.connect(master); w.start();
    const wl = ac.createOscillator(), wlg = ac.createGain(); wl.frequency.value = 0.11; wlg.gain.value = 180; wl.connect(wlg); wlg.connect(wf.frequency); wl.start();
  } catch (e) { ac = null; }
}
function sNoise(dur, freq, vol) {
  if (!ac || vol < 0.02 || sndN > 10) return; sndN++; setTimeout(() => sndN--, dur * 600);
  const t = ac.currentTime, src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(Math.max(50, freq * 0.15), t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random(), dur + 0.05);
}
function sTone(a, b, dur, vol, type) {
  if (!ac || vol < 0.02) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'square';
  o.frequency.setValueAtTime(a, t); o.frequency.exponentialRampToValueAtTime(b, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const nearVol = (x, y, z) => { const c = camera.position; return clamp(1 - Math.hypot(x - c.x, y - c.y, z - c.z) / 520, 0, 1) ** 2; };
addEventListener('keydown', e => { audioInit(); if (e.code === 'KeyN' && master) { muted = !muted; master.gain.value = muted ? 0 : 0.6; } });
addEventListener('mousedown', audioInit);

// ---------- state ----------
let dome = null, G = 9, WS = G * SS, level = 1, sectors = [], units = [], shots = [], booms = [];
let energy = [0, 0, 0], income = [0, 0, 0], hq = [null, null, null];
let ctrl = null, aimYaw = 0, aimPitch = 0, mode = 'drive', state = 'title', paused = false, T = 0;
let sel = new Set(), tick = 0, aiT = 0, buildCool = 0, drag = null;
const keys = {};
const secAt = (x, z) => sectors[clamp(Math.floor(z / SS), 0, G - 1) * G + clamp(Math.floor(x / SS), 0, G - 1)];

function say(t, col) {
  sTone(col === CSS[2] ? 300 : 620, col === CSS[2] ? 180 : 880, 0.14, 0.07, 'triangle');
  const d = document.createElement('div'); d.textContent = t; if (col) d.style.color = col; $('log').prepend(d);
  while ($('log').children.length > 4) $('log').lastChild.remove();
  setTimeout(() => d.style.opacity = 0, 3500); setTimeout(() => d.remove(), 4200);
}

function genLevel() {
  while (scene.children.length) scene.remove(scene.children[0]);
  scene.add(new THREE.HemisphereLight(0x9db4cc, 0x2c2822, 0.85));
  const sun = new THREE.DirectionalLight(0xffc48a, 0.7); sun.position.set(0.8, 0.45, 0.25); scene.add(sun);
  // dusk sky dome: haze at the horizon, a dull ember band, night overhead
  const dg = new THREE.SphereGeometry(2400, 24, 12), dc = [], pos = dg.attributes.position, A = new THREE.Color(FOGC), B = new THREE.Color(0x7a4a3a), C = new THREE.Color(0x0b1020), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) { const t = clamp(pos.getY(i) / 2400, 0, 1); if (t < 0.12) tmp.copy(A).lerp(B, t / 0.12 * 0.55); else tmp.copy(A).lerp(B, 0.55).lerp(C, Math.min(1, (t - 0.12) / 0.45)); dc.push(tmp.r, tmp.g, tmp.b); }
  dg.setAttribute('color', new THREE.Float32BufferAttribute(dc, 3));
  dome = new THREE.Mesh(dg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })); dome.renderOrder = -1; scene.add(dome);
  G = Math.min(8 + level, 13); WS = G * SS;
  const r = rng(level * 9173 + 5);
  sectors = []; units = []; shots = []; booms = []; sel = new Set();
  const under = new THREE.Mesh(new THREE.PlaneGeometry(WS + 4000, WS + 4000), lam(0x2b3238)); under.rotation.x = -Math.PI / 2; under.position.set(WS / 2, -0.6, WS / 2); scene.add(under);
  // stations: mirrored so both sides get the same chances
  const st = new Set([1 * G + 2, (G - 2) * G + (G - 3)]);
  let guard = 0;
  while (st.size < 2 + 2 * Math.round(G / 3) && guard++ < 200) {
    const i = Math.floor(r() * G), j = Math.floor(r() * G);
    if ((i < 4 && j < 4) || (i > G - 5 && j > G - 5)) continue;
    st.add(j * G + i); st.add((G - 1 - j) * G + (G - 1 - i));
  }
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const owner = (i < 3 && j < 3) ? 1 : (i > G - 4 && j > G - 4) ? 2 : 0;
    const s = { i, j, cx: (i + 0.5) * SS, cz: (j + 0.5) * SS, owner, hp: owner ? 100 : 60, station: st.has(j * G + i), blds: [], cnt: [0, 0, 0], shade: 0.82 + r() * 0.3 };
    s.tile = new THREE.Mesh(GEO.tile, lam(0xffffff, TEX.ground)); s.tile.position.set(s.cx, 0, s.cz); scene.add(s.tile);
    const isHQ = (i === 1 && j === 1) || (i === G - 2 && j === G - 2);
    if (s.station) {
      const g = new THREE.Group(); g.position.set(s.cx, 0, s.cz);
      cyl(MAT.dark, 13, 6, 0, 3, 0, g); cyl(MAT.bld[0], 6, 44, 0, 22, 0, g);
      s.orb = new THREE.Mesh(GEO.sph, MAT.glow[owner]); s.orb.scale.setScalar(9); s.orb.position.y = 50; g.add(s.orb);
      for (let k = 0; k < 3; k++) box(MAT.dark, 3, 30, 3, Math.sin(k * TAU / 3) * 16, 15, Math.cos(k * TAU / 3) * 16, g);
      scene.add(g); s.blds.push({ x: s.cx, z: s.cz, w: 30, d: 30, h: 56, fixed: true });
    } else if (!isHQ) {
      const n = 1 + Math.floor(r() * 3.4);
      for (let k = 0; k < n; k++) {
        const w = 14 + r() * 22, d = 14 + r() * 22, h = 8 + r() * r() * 34;
        const b = { x: s.cx + (r() - 0.5) * 80, z: s.cz + (r() - 0.5) * 80, w, d, h };
        b.mesh = new THREE.Mesh(GEO.box, MAT.bld[owner]); b.mesh.position.set(b.x, h / 2, b.z); b.mesh.scale.set(w, h, d); scene.add(b.mesh);
        s.blds.push(b);
      }
    }
    sectors.push(s); paint(s);
  }
  energy = [0, 300, 80 + level * 80];
  hq[1] = addUnit('hq', 1, 1.5 * SS, 1.5 * SS); hq[2] = addUnit('hq', 2, WS - 1.5 * SS, WS - 1.5 * SS);
  hq[1].yaw = Math.PI / 4; hq[2].yaw = Math.PI * 1.25;
  for (let k = 0; k < 2; k++) { spawn('tank', 1, true); spawn('scout', 1, true); }
  for (let k = 0; k < 2 + level; k++) spawn(k % 2 ? 'scout' : 'tank', 2, true);
  ctrl = hq[1]; aimYaw = Math.PI / 4; aimPitch = -0.35; T = 0; aiT = 2; tick = 0;
  calcIncome();
}

function paint(s) {
  const c = new THREE.Color(COL[s.owner]).multiplyScalar(s.owner ? 0.6 : 0.62).lerp(new THREE.Color(0x6a705c), s.owner ? 0.35 : 0.65).multiplyScalar(s.shade);
  s.tile.material.color.copy(c);
  for (const b of s.blds) if (b.mesh) b.mesh.material = MAT.bld[s.owner];
  if (s.orb) s.orb.material = MAT.glow[s.owner];
}
function capture(s, f) {
  const old = s.owner; s.owner = f; s.hp = 35; paint(s); calcIncome();
  if (f === 1) say(s.station ? 'Power station captured' : 'Sector captured', CSS[1]);
  else if (old === 1) say(s.station ? 'We lost a power station!' : 'Sector lost', CSS[2]);
}
function calcIncome() {
  for (const f of [1, 2]) {
    let n = 0, st = 0; for (const s of sectors) if (s.owner === f) { n++; if (s.station) st++; }
    const eff = st ? Math.min(1, n / (7 * st)) : 0;
    income[f] = 1 + st * 5.5 * eff * (f === 2 ? 0.5 + level * 0.12 : 1);
    income['n' + f] = n; income['s' + f] = st; income['e' + f] = eff;
  }
}

function addUnit(type, f, x, z) {
  const d = DEF[type];
  const u = { type, def: d, fac: f, x, z, y: type === 'hq' ? 46 : d.air ? 36 : 0, yaw: rnd(0, TAU), hp: d.hp, max: d.hp, cool: rnd(0, 1), tgt: null, order: null, think: rnd(0, 0.3), dead: false, mesh: unitMesh(type, f) };
  scene.add(u.mesh); units.push(u); return u;
}
function spawn(type, f, free) {
  const d = DEF[type], h = hq[f];
  if (!h || h.dead) return null;
  if (!free) {
    if (energy[f] < d.cost) { if (f === 1) say('Not enough energy'); return null; }
    if (units.filter(u => u.fac === f && u.type !== 'hq').length >= (f === 2 ? 11 + level * 6 : UNIT_CAP)) { if (f === 1) say('Unit limit reached'); return null; }
    energy[f] -= d.cost;
  }
  const a = rnd(0, TAU), rr = rnd(45, 62);
  const u = addUnit(type, f, clamp(h.x + Math.sin(a) * rr, 8, WS - 8), clamp(h.z + Math.cos(a) * rr, 8, WS - 8));
  u.yaw = a; boom(u.x, u.y + 3, u.z, 7, COL[f]);
  return u;
}

function boom(x, y, z, size, color) {

  if (e.code === 'KeyH') { takeControl(hq[1]); setMode('drive'); }

  if (e.code === 'KeyE' && mode === 'drive') { // hop into the nearest friendly unit ahead
    let best = null, bd = 1e9; for (const u of units) { if (u.dead || u.fac !== 1 || u === ctrl) continue; const d = Math.hypot(u.x - ctrl.x, u.z - ctrl.z), a = Math.abs(angDiff(aimYaw, Math.atan2(u.x - ctrl.x, u.z - ctrl.z))); const sc = d * (1 + a * 2); if (sc < bd) { bd = sc; best = u; } }
    if (best) takeControl(best);
  }
  const b = BUILDABLE.find(t => DEF[t].key === e.key); if (b) build(b);
});
addEventListener('keyup', e => keys[e.code] = 0);
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });
function build(t) { if (state !== 'play' || buildCool > 0) return; if (spawn(t, 1)) { buildCool = 0.35; say(DEF[t].name + ' assembled', CSS[1]); } }
BUILDABLE.forEach(t => { const b = document.createElement('button'); b.dataset.t = t; b.innerHTML = '<b>' + DEF[t].key + '</b> ' + DEF[t].name + ' · ' + DEF[t].cost; b.onclick = () => build(t); $('bar').appendChild(b); });

// ---------- HUD / overlay ----------
function hud() {
  const meter = (v, col) => '<span class="meter"><i style="width:' + clamp(v * 100, 0, 100) + '%;background:' + col + '"></i></span>';
  $('tl').innerHTML = 'ENERGY <b style="color:#ffd76a">' + Math.floor(energy[1]) + '</b>  +' + income[1].toFixed(1) + '/s<br>' +
    'SECTORS ' + income.n1 + ' · STATIONS ' + income.s1 + ' · GRID ' + Math.round(income.e1 * 100) + '%<br>' +
    'FORCES ' + units.filter(u => u.fac === 1 && u.type !== 'hq').length + '/' + UNIT_CAP + ' · THEATRE ' + level;
  const h1 = hq[1], h2 = hq[2];
  $('tr').innerHTML = (ctrl ? 'CONTROL: ' + ctrl.def.name.toUpperCase() + ' ' + meter(ctrl.hp / ctrl.max, '#46e0a0') + '<br>' : '') +
    'HOST STATION ' + meter(h1.hp / h1.max, '#27c6da') + '<br>ASHFALL HOST ' + meter(h2.hp / h2.max, '#f0603c') + '<br>ASHFALL SECTORS ' + income.n2;
  $('help').textContent = mode === 'map'
    ? 'MAP · click/drag select · right-click: move (Host Station: jump, ' + JUMP_COST + ' energy) · double-click or ENTER: drive unit · Q: select all · TAB: close'
    : 'W/S drive · A/D or mouse turn · click or F fire' + (ctrl && ctrl.type === 'gunship' ? ' · SPACE/C climb/descend' : '') + ' · E hop to nearest unit · H Host Station · TAB map';
  for (const b of $('bar').children) b.classList.toggle('no', energy[1] < DEF[b.dataset.t].cost);
}
function showOverlay(html) { $('ovbox').innerHTML = html; $('ov').style.display = 'flex'; }
function advance() {
  if (state === 'won') level++; else if (state === 'lost') level = 1;
  genLevel(); state = 'play'; paused = false; $('ov').style.display = 'none'; setMode('drive');
  say('Theatre ' + level + ': destroy the Ashfall Host Station');
}
$('ov').addEventListener('click', advance);
showOverlay('<h1>GRID DOMINION</h1><h2>SECTOR WARFARE · COMMAND AND DRIVE</h2>' +
  'You command a hovering <b>Host Station</b>. It turns energy into war machines, and you can take the controls of any of them.<br><br>' +
  '• Park units in a sector (or shoot its buildings) to wear it down and <b>capture</b> it.<br>' +
  '• <b>Power stations ⚡</b> feed your energy; each needs about seven sectors of grid to run at full output.<br>' +
  '• Win by destroying the enemy Host Station. Lose yours and it is over.<br><br>' +
  '<kbd>1-4</kbd> build · <kbd>TAB</kbd> command map · <kbd>W A S D</kbd> + mouse drive · <kbd>click</kbd>/<kbd>F</kbd> fire<br>' +
  '<kbd>E</kbd> hop into nearest unit · <kbd>H</kbd> back to Host Station · <kbd>P</kbd> pause · <kbd>N</kbd> mute' +
  '<div class="go">Click or press ENTER to deploy</div>');

// ---------- loop ----------
function step(dt) { if (state === 'play' && !paused) update(dt); else if (state !== 'play') { T += dt; if (state === 'title') { aimYaw += dt * 0.1; } } }
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); placeCamera(); renderer.render(scene, camera); drawMap();
  hudT -= dt; if (hudT <= 0) { hudT = 0.15; hud(); }
  requestAnimationFrame(frame);
}
genLevel(); requestAnimationFrame(frame);
window.__g = { get units() { return units; }, get sectors() { return sectors; }, get energy() { return energy; }, get income() { return income; }, get state() { return state; }, get ctrl() { return ctrl; }, get hq() { return hq; }, get sel() { return sel; },
  keys, step, advance, spawn, takeControl, setMode, orderTo, hurt, set aim(v) { aimYaw = v[0]; aimPitch = v[1]; } };
})();
